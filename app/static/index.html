<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11182b">
<title>EventSphere | Discover. Book. Experience.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%236757e8'/%3E%3Ccircle cx='66' cy='36' r='14' fill='%23baf3ed'/%3E%3C/svg%3E">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark nav-glass sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#/"><span class="brand-dot">●</span> EventSphere</a>
    <div class="nav-bell" id="navBell"></div>
    <button class="navbar-toggler border-0" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <div class="navbar-nav me-auto gap-lg-1 mt-2 mt-lg-0" id="navLinks"></div>
      <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0" id="navAuth"></div>
    </div>
  </div>
</nav>

<main id="view"></main>

<footer class="footer">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <b>EventSphere</b><span>Discover · Book · Experience</span><span>Simulated payments only — no real cards</span>
  </div>
</footer>

<!-- Auth modal -->
<div class="modal fade" id="authModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content modal-rounded">
    <div class="modal-header border-0 pb-0"><h5 class="modal-title" id="authTitle">Welcome back</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <form id="authForm" data-form="auth" autocomplete="on">
        <div id="nameWrap" class="mb-3 d-none"><label class="form-label" for="fullName">Full name</label><input id="fullName" class="form-control" autocomplete="name"></div>
        <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control" required autocomplete="username"></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" type="password" class="form-control" minlength="8" required autocomplete="current-password"></div>
        <button class="btn btn-brand w-100" id="authSubmit">Continue</button>
      </form>
      <div id="authError" class="small text-danger mt-3" role="alert"></div>
      <div class="small mt-3 text-center"><a href="#" data-act="switchAuth" id="authSwitch">Create an account</a></div>
      <div class="demo-box mt-3" id="demoBox">
        <div class="meta mb-2">Demo accounts</div>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-act="demo" data-e="admin@eventsphere.lk" data-p="Admin@12345">Admin</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-act="demo" data-e="staff@eventsphere.lk" data-p="Staff@12345">Gate staff</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" data-act="demo" data-e="attendee@eventsphere.lk" data-p="Attendee@12345">Attendee</button>
        </div>
      </div>
    </div>
  </div></div>
</div>

<!-- Generic modal -->
<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" id="modalDialog"><div class="modal-content modal-rounded">
    <div class="modal-header border-0 pb-0"><h5 class="modal-title" id="modalTitle"></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body" id="modalBody"></div>
  </div></div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" style="z-index:2000"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
